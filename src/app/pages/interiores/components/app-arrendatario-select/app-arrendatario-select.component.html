@if (!_inf.showLoader()) {
  <div class="container p-0">
    <div>
      <div class="form-floating">
        <select
        (change)="onChange($event)"
          class="form-select"
          id="floatingSelect"
          aria-label="Floating label select example"
        >
          @for (arrendatario of arrendatarios; track arrendatario.id) {
            <option [value]="arrendatario.id">
              {{ arrendatario.alias }} - {{ arrendatario.nombre }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="d-flex flex-row gap-2 mt-2">
      <button type="button" class="btn btn-warning w-100" (click)="controlClose.emit(false)">
        <ion-icon name="close-circle" class="text-light" size="lg"> </ion-icon>
      </button>
      <button type="button" class="btn btn-primary w-100" size="lg" (click)="ok()">
        <ion-icon name="checkmark-circle"></ion-icon>
      </button>
    </div>
  </div>
}
