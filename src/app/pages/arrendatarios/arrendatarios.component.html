<div class="my-3">
  <ul ngbNav #nav="ngbNav" class="nav-tabs">
    <li [ngbNavItem]="1">
      <button ngbNavLink>Filtros</button>
      <ng-template ngbNavContent>
        <div class="d-flex flex-row gap-3 py-3">
          <select
          #filterState
          (change)="emitStateFilter(filterState.value)"
            class="form-select form-select"
            aria-label=".form-select-lg example"
          >
            <option value="3">Todos</option>
            <option value="1">Activos</option>
            <option value="2">Inactivos</option>
          </select>

          <select
          #filterProperties
          (change)="emitPropertiesFilter( filterProperties.value )"
            class="form-select form-select"
            aria-label=".form-select-lg example"
          >
          <option value="0">Todos</option>
          @for (item of propertyTypes; track $index) {
              <option value="{{item.key}}">{{item.value}}</option>
          }
          </select>
        </div>
      </ng-template>
    </li>
    <li [ngbNavItem]="2">
      <button ngbNavLink>Adeudos</button>
      <ng-template ngbNavContent>
        <div class="d-flex flex-row gap-3 py-3">
          <select
            class="form-select form-select"
            aria-label=".form-select-lg example"
          >
            <option selected>Open this select menu</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>

          <select
            class="form-select form-select"
            aria-label=".form-select-lg example"
          >
            <option selected>Open this select menu</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>
        </div>
      </ng-template>
    </li>
    <li [ngbNavItem]="3">
      <button ngbNavLink>Propiedad</button>
      <ng-template ngbNavContent>
        <div class="d-flex flex-row gap-3 py-3">
          <select
            class="form-select form-select"
            aria-label=".form-select-lg example"
          >
            <option selected>Open this select menu</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>

          <select
            class="form-select form-select"
            aria-label=".form-select-lg example"
          >
            <option selected>Open this select menu</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>
        </div>
      </ng-template>
    </li>
  </ul>
</div>

<div [ngbNavOutlet]="nav" class="mt-2"></div>

<div class=" mb-4">
  <router-outlet></router-outlet>
</div>
